name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Generate Cargo.lock if missing (bootstrap only)
        id: lockfile
        shell: pwsh
        run: |
          if (-not (Test-Path "Cargo.lock")) {
            cargo generate-lockfile
            echo "generated=true" >> $env:GITHUB_OUTPUT
            echo "lock_flag=" >> $env:GITHUB_OUTPUT
          } else {
            echo "generated=false" >> $env:GITHUB_OUTPUT
            echo "lock_flag=--locked" >> $env:GITHUB_OUTPUT
          }

      - name: Upload generated Cargo.lock
        if: steps.lockfile.outputs.generated == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-cargo-lock-${{ github.sha }}
          path: Cargo.lock
          retention-days: 1
          if-no-files-found: error

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets ${{ steps.lockfile.outputs.lock_flag }} -- -D warnings

      - name: Tests
        run: cargo test --workspace ${{ steps.lockfile.outputs.lock_flag }}

      - name: Release build
        run: cargo build --release --workspace ${{ steps.lockfile.outputs.lock_flag }}

      - name: Check budgets
        run: cargo xtask check-budgets

      - name: Write size and budget summary
        shell: pwsh
        run: |
          "## Binary Sizes & Budgets" >> $env:GITHUB_STEP_SUMMARY
          "| Binary | Size (bytes) |" >> $env:GITHUB_STEP_SUMMARY
          "|---|---|" >> $env:GITHUB_STEP_SUMMARY
          Get-ChildItem target/release/*.exe -ErrorAction SilentlyContinue | ForEach-Object {
            "| $($_.Name) | $($_.Length) |" >> $env:GITHUB_STEP_SUMMARY
          }
          "" >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          cargo xtask check-budgets >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY

      - name: Upload test-build executables
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: applock-test-build-${{ github.sha }}
          path: target/release/*.exe
          retention-days: 3
          if-no-files-found: error

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2.1.4
        with:
          command: check advisories bans licenses sources
